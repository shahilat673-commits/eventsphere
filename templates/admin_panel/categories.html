{% extends 'base.html' %}{% block content %}<h3>Event categories</h3><div class="row"><div class="col-md-6"><div class="card p-3 reveal">
<form method="post" class="input-group mb-3">{% csrf_token %}<input class="form-control" name="name" placeholder="New category (e.g. Hackathon)" required><button class="btn btn-brand">Add</button></form>
<table class="table">{% for c in categories %}<tr><td>{{ c.name }}</td><td>{{ c.n }} events</td><td><form method="post" action="{% url 'admin_category_delete' c.pk %}">{% csrf_token %}<button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr>{% endfor %}</table></div></div></div>{% endblock %}
