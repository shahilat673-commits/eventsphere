<div class="mb-2"><div class="stars" role="radiogroup" aria-label="Rating (1 to 5 stars)">{% for n in "54321" %}<input type="radio" name="rating" id="st{{ uid }}-{{ n }}" value="{{ n }}" {% if fb and fb.rating|stringformat:'s' == n %}checked{% endif %} required><label for="st{{ uid }}-{{ n }}" title="{{ n }} star{{ n|pluralize }}">★</label>{% endfor %}</div><div class="fb-hint" data-hint></div></div>
<textarea class="form-control mb-2" name="comment" rows="2" maxlength="500" placeholder="Tell us about your experience (booking, seats, the event…)">{% if fb %}{{ fb.comment }}{% endif %}</textarea>
